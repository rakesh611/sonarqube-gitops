apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube-postgres
  namespace: sonarqube
  labels:
    app: sonarqube-postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sonarqube-postgres

  template:
    metadata:
      labels:
        app: sonarqube-postgres

    spec:

      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432
              name: postgres

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sonarqube-postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarqube-postgres-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: sonarqube-postgres-secret
                  key: POSTGRES_DB

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          resources:
            requests:
              cpu: 500m
              memory: 1Gi

            limits:
              cpu: "2"
              memory: 2Gi

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: sonarqube-postgres-pvc
